cwe: CWE-79
version: 2
scenario_type: web-poc

verification:
  source: runtime
  require_flag: true
  flag_mode: strict
  exit_code: zero

output:
  mode: auto
  format: auto

llm:
  assist_default: true
  assertion_budget: 8

success_signature: Exploit SUCCESS
flag_token: FLAG{XSS_OK}
requires_external_db: false
strict_flag: true

patterns:
  - type: file_regex_contains
    path: "{{service_entry}}"
    pattern: "(render_template_string|HTMLResponse)\\s*\\("
  - type: file_regex_contains
    path: "{{service_entry}}"
    pattern: "(request\\.args\\.get\\('name'|name\\s*:\\s*str\\s*=\\s*Query\\()"
  - type: poc_contains
    path: "{{poc_entry}}"
    contains: "Exploit SUCCESS"
  - type: poc_contains
    path: "{{poc_entry}}"
    contains: "FLAG{XSS_OK}"
