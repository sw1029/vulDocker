cwe: CWE-22
version: 2
scenario_type: web-poc

verification:
  source: runtime
  require_flag: true
  flag_mode: strict
  exit_code: zero

output:
  mode: auto
  format: auto

llm:
  assist_default: false
  assertion_budget: 8

runtime:
  success_mode: text
  success_text_markers:
    - Exploit SUCCESS
  flag_token: FLAG{PATH_TRAVERSAL_OK}
  assertion_program:
    - op: contains
      string: Exploit SUCCESS
    - op: contains
      string: FLAG{PATH_TRAVERSAL_OK}

success_signature: Exploit SUCCESS
flag_token: FLAG{PATH_TRAVERSAL_OK}
requires_external_db: false
strict_flag: true

patterns:
  - type: file_regex_contains
    path: "{{service_entry}}"
    pattern: "read_text\\(|open\\("
  - type: file_regex_contains
    path: "{{service_entry}}"
    pattern: "request\\.args\\.get\\('path'|path\\s*:\\s*str\\s*=\\s*Query\\("
  - type: poc_contains
    path: "{{poc_entry}}"
    contains: "Exploit SUCCESS"
  - type: poc_contains
    path: "{{poc_entry}}"
    contains: "FLAG{PATH_TRAVERSAL_OK}"
