requirement_id: E2E-SQLI-MYSQL-TEMPLATE-0001
intent: 'E2E 회귀: SQLi built-in MySQL sidecar template lane 검증'
vuln_ids:
- CWE-89
multi_vuln: false
language: python
framework: flask
seed: 1000
retriever_commit: stub
corpus_snapshot: rag-snap-mvp
pattern_id: sqli-union-mysql
deps_digest: sha256:placeholder
base_image_digest: sha256:python311
allow_intentional_vuln: true
runtime:
  base_image: python:3.11-slim
  package_manager: pip
  db: mysql
  allow_external_db: true
user_deps:
- requests==2.31.0
- pymysql
generator_mode: template
variation_key:
  mode: deterministic
  self_consistency_k: 1
  pattern_pool_seed: 1000
dep_guard:
  llm_assist: true
  auto_patch: true
policy:
  stop_on_first_failure: false
  guard:
    enforcement: block_both
    failure_policy: closed_unknown
    dynamic_scope: assertions_semantics
    unsupported_op_policy: normalize_retry
    refresh_researcher_on_guard_dsl_error: true
    semantic_refresh_threshold: 2
    hint_payload_enabled: true
    failure_fingerprint_window: 3
    call_budget:
      mode: bundle_once
      ensemble_runs: 3
    autofix:
      level: code
      max_attempts: 1
    low_confidence_unknown_policy: warn
  verifier:
    require_exit_code_zero: true
    strict_flag_default: true
    prefer_rule: true
    llm_assist: false
    low_trust_unknown_policy: warn
    min_promotion_independence: compiler_coupled
    min_name_resolution_confidence: low
  allow_runtime_rule_override_static: false
  allow_name_family_fallback: false
  open_world_strict: false
  require_researcher_evidence: false
  allow_unknown_pattern_seed: false
executor:
  allow_network: true
  network_mode: bridge
  sidecars:
  - name: mysql
    type: mysql
    image: mysql:8.0
    env:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: sqliapp
      MYSQL_USER: sqli
      MYSQL_PASSWORD: sqli_pw
    aliases:
    - sqli-db
    ready_probe:
      type: mysql
      retries: 20
      interval: 2
